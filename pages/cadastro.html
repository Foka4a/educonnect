<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | EduConnect</title>
</head>
<body>
    <main>
        <section class="login-container" aria-labelledby="login-titulo">
            <header>
                <img src="../img/icon.svg" alt="">
                <h1 id="login-titulo">EduConnect</h1>
                <p>Criar conta para continuar</p>
            </header>

            <form method="post" novalidate>
                <label for="email">Nome completo</label>
                <input type="text" id="nome" name="nome" autocomplete="name" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>

                <label for="senha">Confirmar senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>

                <button type="submit">Criar conta</button>
            </form>

            <p>Ja tem conta? <a href="login.html">Fazer login</a></p>
        </section>
    </main>

    <footer>
        <p>Clone do Google Classroom para fins educacionais.</p>
    </footer>
</body>
</html>

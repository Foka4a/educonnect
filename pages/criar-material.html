<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect | Criar material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/criar.css">
    <script src="../scripts/criar.js" defer></script>
</head>

<body class="pagina-criar">
    <!-- Somente professor. Tela cheia, sem menu lateral: × cancela e volta para Atividades. -->
    <header class="barra-superior">
        <div class="barra-superior__marca">
            <a class="botao-icone" href="atividades.html" aria-label="Cancelar e voltar para Atividades" title="Cancelar">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </a>
            <span class="criar-barra__icone" aria-hidden="true">
                <span class="material-symbols-outlined">book</span>
            </span>
            <h1 class="criar-barra__titulo">Material</h1>
        </div>
        <button class="botao-primario" type="submit" form="form-criar">Postar</button>
    </header>

    <main class="criar">
        <form class="criar__form criar__form--material" id="form-criar" method="post" enctype="multipart/form-data" novalidate data-criar>
            <section class="criar__cartao criar__detalhes" aria-label="Detalhes do material">
                <label class="visualmente-oculto" for="titulo">Título (obrigatório)</label>
                <input class="criar__campo" id="titulo" name="titulo" placeholder="Título *" autocomplete="off" required aria-describedby="erro-titulo">
                <p class="criar__erro" id="erro-titulo" role="alert" hidden>Informe o título do material.</p>

                <div class="criar__editor">
                    <div class="criar__texto" id="texto" contenteditable="true" role="textbox" aria-multiline="true"
                        aria-label="Descrição (opcional)" data-placeholder="Descrição (opcional)" data-texto></div>
                    <input type="hidden" name="texto">
                    <div class="criar__ferramentas" role="toolbar" aria-label="Formatação do texto" aria-controls="texto">
                        <button class="botao-icone" type="button" data-comando="bold" aria-pressed="false" aria-label="Negrito" title="Negrito">
                            <span class="material-symbols-outlined" aria-hidden="true">format_bold</span>
                        </button>
                        <button class="botao-icone" type="button" data-comando="italic" aria-pressed="false" aria-label="Itálico" title="Itálico">
                            <span class="material-symbols-outlined" aria-hidden="true">format_italic</span>
                        </button>
                        <button class="botao-icone" type="button" data-comando="underline" aria-pressed="false" aria-label="Sublinhado" title="Sublinhado">
                            <span class="material-symbols-outlined" aria-hidden="true">format_underlined</span>
                        </button>
                        <button class="botao-icone" type="button" data-comando="insertUnorderedList" aria-pressed="false" aria-label="Lista com marcadores" title="Lista">
                            <span class="material-symbols-outlined" aria-hidden="true">format_list_bulleted</span>
                        </button>
                        <button class="botao-icone" type="button" data-comando="removeFormat" aria-label="Remover formatação" title="Remover formatação">
                            <span class="material-symbols-outlined" aria-hidden="true">format_clear</span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="criar__cartao criar__anexar" aria-labelledby="titulo-anexar">
                <h2 class="criar__subtitulo" id="titulo-anexar">Anexar</h2>
                <label class="criar__upload">
                    <input class="visualmente-oculto" type="file" name="anexos" multiple>
                    <span class="criar__upload-botao" aria-hidden="true">
                        <span class="material-symbols-outlined">upload</span>
                    </span>
                    <span>Fazer upload</span>
                </label>
                <ul class="criar__anexos" aria-label="Arquivos anexados" data-anexos></ul>
            </section>
        </form>
    </main>

</body>

</html>

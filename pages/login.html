<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | EduConnect</title>
</head>
<body>
    <main>
        <section class="login-container" aria-labelledby="login-titulo">
            <header>
                <img src="../img/logo.svg" alt="">
                <h1 id="login-titulo">EduConnect</h1>
                <p>Fazer login para continuar</p>
            </header>

            <form method="post" novalidate>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>

                <p id="erro-login" role="alert" hidden>E-mail ou senha incorretos</p>

                <button type="submit">Entrar</button>
            </form>

            <p>Não tem conta? <a href="cadastro.html">Criar conta</a></p>
        </section>
    </main>

    <footer>
        <p>Clone do Google Classroom para fins educacionais.</p>
    </footer>
</body>
</html>

services:
  web:
    container_name: educonnect-web
    build: .
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-educonnect}
      DB_USERNAME: ${DB_USERNAME:-educonnect}
      DB_PASSWORD: ${DB_PASSWORD:-educonnect}
      TZ: America/Sao_Paulo
    volumes:
      - ./:/var/www/html
      - uploads:/var/www/html/backend/storage/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: educonnect-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-educonnect}
      MYSQL_USER: ${DB_USERNAME:-educonnect}
      MYSQL_PASSWORD: ${DB_PASSWORD:-educonnect}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql:
  uploads:
